<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vue Beginner</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

  <div id="app">
    <h1>Hello {{ name }}</h1>
    <button @click="changeName">Change Name</button>
  </div>

  <script>
    const { createApp } = Vue

    createApp({
      data() {
        return {
          name: "Vue Beginner"
        }
      },
      methods: {
        changeName() {
          this.name = "I love Vue!"
        }
      }
    }).mount("#app")
  </script>

</body>
</html>
